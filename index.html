<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قارئ الجواز</title>
<style>
body{font-family:sans-serif;background:#14141f;color:#eee;max-width:640px;margin:0 auto;padding:18px;text-align:center}
button{background:#2a9d8f;color:#fff;border:0;padding:14px 18px;border-radius:12px;font-size:16px;margin:5px}
button.gray{background:#4a4a5a}
img#preview{max-width:100%;border-radius:12px;margin-top:12px}
#st{color:#f4a261;margin:14px;font-size:15px;min-height:20px}
#result{background:#20202c;border-radius:14px;padding:12px;text-align:right}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #3a3a4a;padding:9px 4px}
.row b{color:#8ecae6;white-space:nowrap}
.val{word-break:break-all;direction:ltr;text-align:right}
.warn{color:#e76f51;font-size:13px;margin-top:8px}
.src{font-size:11px;color:#6a6a7a;margin-top:6px}
#keybox{background:#20202c;border-radius:12px;padding:12px;margin:10px 0;text-align:right}
#apikey{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #3a3a4a;background:#14141f;color:#eee;direction:ltr;margin-top:6px}
.small{font-size:12px;color:#8a8a9a}
.error{background:#3a1a1a;color:#ff9a8a;border-radius:12px;padding:14px;margin:12px;font-size:14px;text-align:right}
</style>
</head>
<body>
<h2>🛂 قارئ بيانات الجواز</h2>

<div id="keybox">
<b style="color:#8ecae6">🔑 مفتاح Mindee (مطلوب)</b>
<input id="apikey" type="password" placeholder="الصق مفتاح Mindee هنا" oninput="saveKey()">
<div class="small">يُحفظ في هاتفك فقط ولا يراه أحد.</div>
</div>

<div>
<button onclick="cam.click()">📷 التقاط بالكاميرا</button>
<button onclick="gal.click()">🖼️ اختيار من المعرض</button>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="gal" type="file" accept="image/*" hidden>
<img id="preview" hidden>
<div id="st"></div>
<div id="result" hidden></div>
<div id="errbox" hidden></div>
<button id="copyBtn" class="gray" hidden onclick="copyAll()">📋 نسخ البيانات كنص</button>
<textarea id="raw" hidden></textarea>

<script>
var st=document.getElementById('st'),res=document.getElementById('result'),pv=document.getElementById('preview'),
    copyBtn=document.getElementById('copyBtn'),raw=document.getElementById('raw'),
    errbox=document.getElementById('errbox');
var C={LBY:'ليبيا',EGY:'مصر',TUN:'تونس',DZA:'الجزائر',MAR:'المغرب',SDN:'السودان',YEM:'اليمن',SYR:'سوريا',JOR:'الأردن',LBN:'لبنان',PSE:'فلسطين',IRQ:'العراق',KWT:'الكويت',QAT:'قطر',ARE:'الإمارات',OMN:'عُمان',BHR:'البحرين',SAU:'السعودية',TUR:'تركيا',USA:'أمريكا',GBR:'بريطانيا',FRA:'فرنسا',ITA:'إيطاليا',DEU:'ألمانيا',MLI:'مالي',NER:'النيجر',TCD:'تشاد',CIV:'ساحل العاج',SEN:'السنغال',GHA:'غانا',NGA:'نيجيريا',TUN2:''};

var origFile=null;
document.getElementById('cam').onchange=function(e){go(e.target.files[0])};
document.getElementById('gal').onchange=function(e){go(e.target.files[0])};

function saveKey(){localStorage.setItem('mk',document.getElementById('apikey').value.trim())}
document.getElementById('apikey').value=localStorage.getItem('mk')||'';

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showError(msg){
 errbox.hidden=false;
 errbox.innerHTML='⚠️ '+esc(msg);
 res.hidden=true;copyBtn.hidden=true}

function go(f){
 if(!f)return;
 origFile=f;
 errbox.hidden=true;res.hidden=true;copyBtn.hidden=true;
 pv.onload=run;
 pv.src=URL.createObjectURL(f);
 pv.hidden=false}

function raw2jpg(file){
 return new Promise(function(resolve){
  var fr=new FileReader();
  fr.onload=function(){
   var img=new Image();
   img.onload=function(){
    var mx=1600,r=img.width>img.height?img.width/img.height:1;
    var sc=Math.min(1,mx/(img.width>img.height?img.width:img.height));
    if(sc>=1){resolve(file);return}
    var c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    var x=c.getContext('2d');
    x.imageSmoothingQuality='high';
    x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){resolve(b||file)},'image/jpeg',0.95)};
   img.src=fr.result};
  fr.readAsDataURL(file)})}

async function run(){
 var key=(localStorage.getItem('mk')||'').trim();
 if(!key){
  showError('لا يوجد مفتاح Mindee. اذهب إلى mindee.com → سجّل → انسخ المفتاح من منتج Passport والصقه في الصندوق أعلاه، ثم أعد اختيار الصورة.');
  st.textContent='';
  return}

 try{
  st.textContent='☁️ جارٍ القراءة بالمحرك السحابي...';
  var file=await raw2jpg(origFile);
  var vers=['v5','v4','v3'],last='فشل غير معروف';
  var p=null;

  for(var i=0;i<vers.length&&!p;i++){
   var fd=new FormData();
   fd.append('document',file,'passport.jpg');
   var resp=await fetch('https://api.mindee.net/v1/products/mindee/passport/'+vers[i]+'/predict',
    {method:'POST',headers:{'Authorization':'Bearer '+key},body:fd});

   if(resp.status===404){last='نسخة API غير متاحة، جارّ تجربة التالية';continue}

   if(resp.status===401||resp.status===403){
    showError('المفتاح غير صحيح أو منتهي. تأكد من نسخه كاملاً من لوحة Mindee (منتج Passport → API Keys).');
    st.textContent='';
    return}

   if(resp.status===402||resp.status===429){
    showError('انتهت حصتك المجانية لهذا الشهر (أو تجاوزت حد المرسلات في الدقيقة). انتظر قليلاً أو راجع خطتك في لوحة Mindee.');
    st.textContent='';
    return}

   if(!resp.ok){
    showError('خطأ من السيرفر (HTTP '+resp.status+'). أعد المحاولة بعد قليل.');
    st.textContent='';
    return}

   var j=await resp.json();
   var pr=j&&j.document&&j.document.prediction;
   if(!pr||(!pr.surname&&!pr.document_number)){
    showError('لم يتعرف المحرك على جواز في هذه الصورة. جرّب صورة أوضح لصفحة البيانات (صفحة الصورة والبيانات، ليست الغلاف).');
    st.textContent='';
    return}

   p=pr}

  if(!p){
   showError(last);
   st.textContent='';
   return}

  st.textContent='✅ تمت القراءة بنجاح';
  renderCloud(p);
 }catch(e){
  if((''+e.message).indexOf('fetch')>-1||(''+e).indexOf('Network')>-1){
   showError('تعذر الاتصال بالسيرفر. تحقق من الإنترنت — وإذا تكررت أخبرني لأضيف وسيطاً يحل الحجب المحتمل.')}
  else{showError(e.message)}
  st.textContent=''}}

function renderCloud(p){
 function v(x){return x&&x.value?x.value:''}
 var gv='';
 if(p.given_names&&p.given_names.length)gv=p.given_names.map(function(x){return x.value||''}).join(' ').trim();
 var sn=v(p.surname),doc=v(p.document_number),nat=v(p.nationality),ctry=v(p.country),
     dob=v(p.birth_date),exp=v(p.expiry_date),sex=v(p.sex),iss=v(p.issue_date),
     bp=v(p.birth_place),auth=v(p.issuing_authority),mrz=v(p.mrz);
 var rows=[];
 function add(l,val){if(val)rows.push([l,val])}
 add('اسم العائلة',sn);
 add('الاسم الأول',gv);
 var natD=C[nat]?C[nat]:nat;
 if(!natD&&ctry)natD=C[ctry]?C[ctry]:ctry;
 add('الجنسية',natD?natD+(nat&&natD!==nat?' ('+nat+')':''):'');
 add('رقم الجواز',doc);
 add('تاريخ الميلاد',dob);
 add('الجنس',sex==='M'?'ذكر M':sex==='F'?'أنثى F':sex);
 add('تاريخ الإصدار',iss);
 add('تاريخ الانتهاء',exp);
 add('مكان الميلاد',bp);
 add('جهة الإصدار',auth);

 var h='';
 rows.forEach(function(rw){h+='<div class="row"><b>'+rw[0]+'</b><span class="val">'+esc(rw[1])+'</span></div>'});
 if(!rows.length){
  showError('لم يستخرج المحرك أي بيانات من هذه الصورة — جرّب صورة أوضح.');
  return}
 h+='<div class="src">المصدر: المحرك السحابي Mindee (موديل مدرَّب على الجوازات) ✔</div>';
 h+='<div class="warn">راجع رقم الجواز وتاريخ الانتهاء قبل إصدار التذكرة كعادة دائمة.</div>';
 res.innerHTML=h;res.hidden=false;

 var out=[];
 if(sn)out.push('SURNAME: '+sn);
 if(gv)out.push('GIVEN NAMES: '+gv);
 if(nat)out.push('NATIONALITY: '+nat);
 if(doc)out.push('PASSPORT NO: '+doc);
 if(dob)out.push('DATE OF BIRTH: '+dob);
 if(sex)out.push('SEX: '+sex);
 if(iss)out.push('ISSUE DATE: '+iss);
 if(exp)out.push('EXPIRY: '+exp);
 if(bp)out.push('PLACE OF BIRTH: '+bp);
 if(auth)out.push('AUTHORITY: '+auth);
 raw.value=out.join('\n');
 copyBtn.hidden=false}

function copyAll(){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(raw.value).then(function(){alert('تم النسخ ✅')})}
 else{raw.hidden=false;raw.select();document.execCommand('copy');raw.hidden=true;alert('تم النسخ ✅')}}
</script>
</body>
</html>
