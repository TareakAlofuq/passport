<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قارئ الجواز</title>
<style>
body{font-family:sans-serif;background:#14141f;color:#eee;max-width:640px;margin:0 auto;padding:18px;text-align:center}
button{background:#2a9d8f;color:#fff;border:0;padding:14px 18px;border-radius:12px;font-size:16px;margin:5px}
button.gray{background:#4a4a5a}
img#preview{max-width:100%;border-radius:12px;margin-top:12px}
#st{color:#f4a261;margin:14px;font-size:15px;min-height:20px}
#result{background:#20202c;border-radius:14px;padding:12px;text-align:right}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #3a3a4a;padding:9px 4px}
.row b{color:#8ecae6;white-space:nowrap}
.val{word-break:break-all}
.warn{color:#e76f51;font-size:13px;margin-top:8px}
.tag{display:inline-block;background:#3a3a4a;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px;direction:ltr}
h3{margin:14px 0 4px;color:#8ecae6;font-size:15px}
#rawtext{background:#101018;color:#9be3c9;border-radius:10px;padding:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;text-align:left;direction:ltr;max-height:240px;overflow:auto;margin-top:6px}
</style>
</head>
<body>
<h2>🛂 قارئ بيانات الجواز</h2>
<div>
<button onclick="cam.click()">📷 التقاط بالكاميرا</button>
<button onclick="gal.click()">🖼️ اختيار من المعرض</button>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="gal" type="file" accept="image/*" hidden>
<img id="preview" hidden>
<div id="st"></div>
<div id="result" hidden></div>
<button id="copyBtn" class="gray" hidden onclick="copyAll()">📋 نسخ البيانات كنص</button>
<textarea id="raw" hidden></textarea>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
var st=document.getElementById('st'),res=document.getElementById('result'),pv=document.getElementById('preview'),
    copyBtn=document.getElementById('copyBtn'),raw=document.getElementById('raw');
var C={EGY:'مصر',SAU:'السعودية',YEM:'اليمن',SDN:'السودان',MAR:'المغرب',DZA:'الجزائر',TUN:'تونس',LBY:'ليبيا',SYR:'سوريا',JOR:'الأردن',LBN:'لبنان',PSE:'فلسطين',IRQ:'العراق',KWT:'الكويت',QAT:'قطر',ARE:'الإمارات',OMN:'عُمان',BHR:'البحرين',TUR:'تركيا',USA:'أمريكا',GBR:'بريطانيا',FRA:'فرنسا',DEU:'ألمانيا',ITA:'إيطاليا',IND:'الهند',PAK:'باكستان',BGD:'بنغلاديش',PHL:'الفلبين',IDN:'إندونيسيا',NGA:'نيجيريا',ETH:'إثيوبيا',KEN:'كينيا',SOM:'الصومال',DJI:'جيبوتي',ERI:'إريتريا'};

document.getElementById('cam').onchange=function(e){go(e.target.files[0])};
document.getElementById('gal').onchange=function(e){go(e.target.files[0])};
function go(f){if(!f)return;pv.onload=run;pv.src=URL.createObjectURL(f);pv.hidden=false}
function log(m){if(m.status==='recognizing text')st.textContent='جارٍ القراءة... %'+Math.round(m.progress*100)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* تدوير الصورة بالدرجات المطلوبة */
function rotCanvas(img,rot){
 if(!rot)return img;
 var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
 var c=document.createElement('canvas');
 if(rot%180){c.width=h;c.height=w}else{c.width=w;c.height=h}
 var ctx=c.getContext('2d');
 ctx.translate(c.width/2,c.height/2);
 ctx.rotate(rot*Math.PI/180);
 ctx.drawImage(img,-w/2,-h/2);
 return c}

/* قص الجزء السفلي + تكبير + تدرج رمادي + تقوية التباين */
function prepCanvas(src,scale,cropFrac){
 var w=src.naturalWidth||src.width,h=src.naturalHeight||src.height,sy=0,sh=h;
 if(cropFrac){sh=Math.round(h*cropFrac);sy=h-sh}
 var nw=Math.round(w*scale),nh=Math.round(sh*scale);
 var c=document.createElement('canvas');c.width=nw;c.height=nh;
 var ctx=c.getContext('2d');
 ctx.drawImage(src,0,sy,w,sh,0,0,nw,nh);
 var d=ctx.getImageData(0,0,nw,nh),p=d.data,i,g,min=255,max=0;
 for(i=0;i<p.length;i+=4){g=(p[i]*0.3+p[i+1]*0.59+p[i+2]*0.11)|0;p[i]=p[i+1]=p[i+2]=g;if(g<min)min=g;if(g>max)max=g}
 var rng=Math.max(1,max-min);
 for(i=0;i<p.length;i+=4){g=Math.round((p[i]-min)*255/rng);p[i]=p[i+1]=p[i+2]=g}
 ctx.putImageData(d,0,0);
 return c}

async function run(){
 try{
  res.hidden=true;copyBtn.hidden=true;
  st.textContent='جارٍ تحميل محرك القراءة... (أول مرة فقط يأخذ وقتاً أطول)';
  var scale=Math.min(2,1500/(pv.naturalWidth||pv.width));
  var wk=await Tesseract.createWorker('eng',1,{logger:log});
  await wk.setParameters({tessedit_pageseg_mode:'6'});

  /* نجرّب الاتجاهات الأربعة: معتدل، مقلوب، جانبي يمين، جانبي يسار */
  var rots=[0,180,90,270],d=null,rotUsed=0,i,j,r;
  for(i=0;i<rots.length&&!d;i++){
   var rot=rots[i],src=rotCanvas(pv,rot),frs=[0.30,0.45];
   for(j=0;j<frs.length&&!d;j++){
    st.textContent=rot?('🔄 الصورة باتجاه خاطئ ('+rot+'°) — جارٍ التصحيح والقراءة...'):'جارٍ قراءة سطور MRZ...';
    r=await wk.recognize(prepCanvas(src,scale,frs[j]));
    d=extract(r.data.text);
   }
   if(d)rotUsed=rot;
  }
  if(d){
   await wk.terminate();
   if(rotUsed){pv.onload=null;pv.src=rotCanvas(pv,rotUsed).toDataURL('image/jpeg',0.9)}
   st.textContent='✅ تمت القراءة'+(rotUsed?' (تم تصحيح اتجاه الصورة تلقائياً)':'');
   render(d);return}

  /* بلا MRZ: نقرأ الصفحة كاملة ونختار الاتجاه الأفضل */
  st.textContent='لم أجد سطور MRZ — جارٍ قراءة الصفحة المطبوعة كاملة...';
  await wk.setParameters({tessedit_pageseg_mode:'3'});
  var best=null;
  for(i=0;i<2;i++){
   var rot2=i?180:0;
   r=await wk.recognize(prepCanvas(rotCanvas(pv,rot2),scale,null));
   var score=(r.data.text.match(/[A-Z]{2,}/g)||[]).length;
   if(!best||score>best.score)best={text:r.data.text,score:score,rot:rot2};
  }
  await wk.terminate();
  if(best.rot){pv.onload=null;pv.src=rotCanvas(pv,best.rot).toDataURL('image/jpeg',0.9)}
  viz(best.text);
 }catch(err){st.textContent='⚠️ حصل خطأ: '+err.message}
}

/* ---------- قراءة MRZ ---------- */
function extract(text){
 var ls=text.toUpperCase().split(/\n/).map(function(l){return l.replace(/[^A-Z0-9<]/g,'')})
  .filter(function(l){return l.length>=40&&l.length<=48&&l.indexOf('>')===-1&&l.indexOf('<')>-1});
 if(ls.length===0)return null;
 var l1,l2;
 if(ls.length===1){var m=ls[0];if(m.length>=86){l1=m.slice(0,44);l2=m.slice(44,88)}else return null}
 else{l1=ls[ls.length-2];l2=ls[ls.length-1]}
 if(l1.charAt(0)!=='P')return null;
 l1=(l1+Array(45).join('<')).slice(0,44);
 l2=(l2+Array(45).join('<')).slice(0,44);
 return parseTD3(l1,l2)}

function cd(s){var w=[7,3,1],t=0,i,c;
 for(i=0;i<s.length;i++){c=s.charAt(i);
  t+=(c==='<'?0:(c<='9'?+c:c.charCodeAt(0)-55))*w[i%3]}
 return t%10}

function dt(s,isExp){
 if(!/^\d{6}$/.test(s))return s;
 var y=+s.slice(0,2),now=new Date().getFullYear()%100;
 return (isExp?2000+y:(y>now?1900+y:2000+y))+'-'+s.slice(2,4)+'-'+s.slice(4)}

function parseTD3(l1,l2){
 var nm=l1.slice(5).split('<<');
 var d={issuer:l1.slice(2,5).replace(/</g,''),
  surname:(nm[0]||'').replace(/</g,' ').trim(),
  given:(nm[1]||'').replace(/</g,' ').trim(),
  doc:l2.slice(0,9).replace(/</g,''),
  country:l2.slice(10,13).replace(/</g,''),
  dob:l2.slice(13,19),sex:l2.charAt(20),exp:l2.slice(21,27)};
 d.okDoc=cd(l2.slice(0,9))===+l2.charAt(9);
 d.okDob=cd(d.dob)===+l2.charAt(19);
 d.okExp=cd(d.exp)===+l2.charAt(27);
 return d}

function mark(b){return b?' ✔':' ⚠️'}

function render(d){
 var cc=C[d.country]||C[d.issuer]||d.country||d.issuer;
 var rows=[['اسم العائلة',d.surname],['الاسم الأول',d.given],['الجنسية',cc],
  ['رقم الجواز',d.doc+mark(d.okDoc)],['تاريخ الميلاد',dt(d.dob)+mark(d.okDob)],
  ['الجنس',d.sex==='M'?'ذكر (M)':d.sex==='F'?'أنثى (F)':d.sex],
  ['تاريخ الانتهاء',dt(d.exp,true)+mark(d.okExp)]];
 var h='';
 rows.forEach(function(r){h+='<div class="row"><b>'+r[0]+'</b><span class="val">'+esc(r[1])+'</span></div>'});
 h+='<div class="warn">✔ = قراءة مؤكدة بأرقام التحقق، ⚠️ = قارنها بنظرك مع الصورة.</div>';
 res.innerHTML=h;res.hidden=false;
 raw.value='SURNAME: '+d.surname+'\nGIVEN NAMES: '+d.given+'\nNATIONALITY: '+(d.country||d.issuer)
  +'\nPASSPORT NO: '+d.doc+'\nDATE OF BIRTH: '+dt(d.dob)+'\nSEX: '+d.sex+'\nEXPIRY: '+dt(d.exp,true);
 copyBtn.hidden=false}

/* ---------- بلا MRZ: قراءة النص المطبوع ---------- */
function clean(s){return (s||'').replace(/\s+/g,' ').trim()}
var DATEP='\\d{1,2}[ .\\/-](?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[ .\\/-]\\d{2,4}|\\d{2}[ .\\/-]\\d{2}[ .\\/-]\\d{4}';
function viz(text){
 st.textContent='📄 عرض قراءة الصفحة (تقريبية — تحقق منها)';
 var t=text.toUpperCase().replace(/\s+/g,' ');
 function g(re){var m=t.match(re);return m?clean(m[1]):''}
 var f={};
 f['اسم العائلة']=g(new RegExp('SURNAME[\\/:\\s]*([A-Z][A-Z ]{1,30}?)(?=\\s*(?:GIVEN|NATIONALITY|DATE|SEX|TYPE|CODE))'));
 f['الاسم الأول']=g(new RegExp('(?:GIVEN NAMES?|GIVEN NAME|FIRST NAME)[\\/:\\s]*([A-Z][A-Z ]{1,30}?)(?=\\s*(?:NATIONALITY|DATE|SEX|PLACE))'));
 f['الجنسية']=g(new RegExp('NATIONALITY[\\/:\\s]*([A-Z][A-Z ]{1,25}?)(?=\\s*(?:DATE|SEX|PLACE|TYPE))'));
 f['رقم الجواز']=g(new RegExp('(?:PASSPORT NO\\.?|PASSPORT NUMBER|DOCUMENT NO\\.?)[\\/:\\s]*([A-Z0-9]{5,12})'));
 f['تاريخ الميلاد']=g(new RegExp('(?:DATE OF BIRTH|BIRTH DATE)[\\/:\\s]*('+DATEP+')'));
 f['الجنس']=g(/\bSEX[\/:\s]*(M|F)\b/);
 f['تاريخ الانتهاء']=g(new RegExp('(?:EXPIRY DATE|DATE OF EXPIRY|EXPIRATION DATE|EXPIRY)[\\/:\\s]*('+DATEP+')'));
 var found=Object.keys(f).filter(function(k){return f[k]});
 var dates=t.match(/\b\d{1,2}[ .\/-](?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[ .\/-]\d{2,4}\b/g)||t.match(/\b\d{2}[ .\/-]\d{2}[ .\/-]\d{4}\b/g)||[];
 var nums=t.match(/\b[A-Z]{1,2}\d{6,8}\b/g)||[];
 var h='';
 if(found.length){
  h+='<h3>البيانات المستخرجة (تحقق منها بنفسك)</h3>';
  found.forEach(function(k){h+='<div class="row"><b>'+k+'</b><span class="val">'+esc(f[k])+'</span></div>'});
 }else{
  h+='<div class="warn">لم أستطع تحديد الحقول تلقائياً — استخدم التواريخ والأرقام بالأسفل، أو انسخ النص الكامل.</div>';
 }
 h+='<h3>التواريخ الموجودة في الصفحة</h3>';
 h+=dates.length?dates.map(function(x){return '<span class="tag">'+x+'</span>'}).join(' '):'<span class="warn">لا يوجد</span>';
 h+='<h3>أرقام مرشحة لرقم الجواز</h3>';
 h+=nums.length?nums.map(function(x){return '<span class="tag">'+x+'</span>'}).join(' '):'<span class="warn">لا يوجد</span>';
 h+='<h3>النص الكامل المقروء (انسخ منه ما تحتاجه)</h3><div id="rawtext">'+esc(text.trim())+'</div>';
 h+='<div class="warn">هذه قراءة تقريبية للنص المطبوع — بدون سطور MRZ لا توجد أرقام تحقق، فقارن دائماً بالصورة قبل إصدار التذكرة.</div>';
 res.innerHTML=h;res.hidden=false;
 raw.value=found.map(function(k){return k+': '+f[k]}).join('\n')
  +'\nالتواريخ: '+dates.join(' , ')+'\nأرقام مرشحة: '+nums.join(' , ')
  +'\n--- النص الكامل ---\n'+text.trim();
 copyBtn.hidden=false}

function copyAll(){
 var t=raw;
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t.value).then(function(){alert('تم النسخ ✅')})
 }else{t.hidden=false;t.select();document.execCommand('copy');t.hidden=true;alert('تم النسخ ✅')}}
</script>
</body>
</html>
