<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قارئ الجواز</title>
<style>
body{font-family:sans-serif;background:#14141f;color:#eee;max-width:640px;margin:0 auto;padding:18px;text-align:center}
button{background:#2a9d8f;color:#fff;border:0;padding:14px 18px;border-radius:12px;font-size:16px;margin:5px}
button.gray{background:#4a4a5a}
button.small{background:transparent;border:1px solid #3a3a4a;color:#8ecae6;padding:8px 14px;font-size:13px;border-radius:10px;margin:4px 2px}
img#preview{max-width:100%;border-radius:12px;margin-top:12px}
#st{color:#f4a261;margin:14px;font-size:15px;min-height:20px}
#result{background:#20202c;border-radius:14px;padding:12px;text-align:right}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #3a3a4a;padding:9px 4px}
.row b{color:#8ecae6;white-space:nowrap}
.val{word-break:break-all;direction:ltr;text-align:right}
.warn{color:#e76f51;font-size:13px;margin-top:8px}
.notes{color:#f4a261;font-size:13px;margin-top:8px;text-align:right}
.src{font-size:11px;color:#6a6a7a;margin-top:6px}
#keybox{background:#20202c;border-radius:12px;padding:12px;margin:10px 0;text-align:right}
.keyrow{display:flex;gap:8px;margin-top:6px}
#apikey{flex:1;padding:10px;border-radius:8px;border:1px solid #3a3a4a;background:#14141f;color:#eee;direction:ltr;min-width:0;font-family:monospace}
.small{font-size:12px;color:#8a8a9a}
.error{background:#3a1a1a;color:#ff9a8a;border-radius:12px;padding:14px;margin:12px;font-size:14px;text-align:right;word-break:break-word}
#testout{font-size:13px;margin-top:8px;text-align:right;min-height:18px;word-break:break-word}
</style>
</head>
<body>
<h2>🛂 قارئ بيانات الجواز</h2>

<div id="keybox">
<b style="color:#8ecae6">🔑 مفتاح Google AI Studio</b>
<div class="keyrow">
<input id="apikey" type="password" placeholder="الصق المفتاح هنا (يبدأ بـ AIza...)" oninput="saveKey()">
<button class="small" style="margin:0" onclick="toggleEye()">👁</button>
</div>
<button class="small" onclick="testKey()">⚡ اختبار المفتاح</button>
<div id="testout"></div>
<div class="small">مجاني من aistudio.google.com بدون بطاقة دفع. يُحفظ في هاتفك فقط.</div>
</div>

<div>
<button onclick="cam.click()">📷 التقاط بالكاميرا</button>
<button onclick="gal.click()">🖼️ اختيار من المعرض</button>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="gal" type="file" accept="image/*" hidden>
<img id="preview" hidden>
<div id="st"></div>
<div id="result" hidden></div>
<div id="errbox" class="error" hidden></div>
<button id="copyBtn" class="gray" hidden onclick="copyAll()">📋 نسخ البيانات كنص</button>
<textarea id="raw" hidden></textarea>

<script>
var st=document.getElementById('st'),res=document.getElementById('result'),pv=document.getElementById('preview'),
    copyBtn=document.getElementById('copyBtn'),raw=document.getElementById('raw'),errbox=document.getElementById('errbox');
var C={LBY:'ليبيا',EGY:'مصر',TUN:'تونس',DZA:'الجزائر',MAR:'المغرب',SDN:'السودان',YEM:'اليمن',SYR:'سوريا',JOR:'الأردن',LBN:'لبنان',PSE:'فلسطين',IRQ:'العراق',KWT:'الكويت',QAT:'قطر',ARE:'الإمارات',OMN:'عُمان',BHR:'البحرين',SAU:'السعودية',TUR:'تركيا',USA:'أمريكا',GBR:'بريطانيا',FRA:'فرنسا',ITA:'إيطاليا',DEU:'ألمانيا',MLI:'مالي',NER:'النيجر',TCD:'تشاد',CIV:'ساحل العاج',SEN:'السنغال',GHA:'غانا',NGA:'نيجيريا'};
var WORD={LIBYAN:'LBY',EGYPTIAN:'EGY',TUNISIAN:'TUN',ALGERIAN:'DZA',MOROCCAN:'MAR',SUDANESE:'SDN',YEMENI:'YEM',SYRIAN:'SYR',JORDANIAN:'JOR',LEBANESE:'LBN',IRAQI:'IRQ',SAUDI:'SAU',TURKISH:'TUR'};

var MODELS=['gemini-2.0-flash','gemini-2.0-flash-001','gemini-flash-latest','gemini-1.5-flash','gemini-1.5-flash-8b','gemini-2.5-flash','gemini-2.0-flash-lite','gemini-1.5-flash-latest'];
var PROXIES=['',
 'https://api.allorigins.win/raw?url=',
 'https://corsproxy.io/?url=',
 'https://api.codetabs.com/v1/proxy?quest='];
var GEM='https://generativelanguage.googleapis.com/v1beta/models/';

var PROMPT=[
'You are an expert passport OCR system. The image shows a passport bio-data page.',
'It may be rotated, mirrored, low quality, or photographed at an angle. Mentally fix the orientation first.',
'Read BOTH the printed zone (English labels like SURNAME, GIVEN NAMES, DATE OF BIRTH; Arabic text may also be present) AND the two MRZ lines at the bottom (starting with P<) if visible.',
'When printed text and MRZ disagree, prefer the MRZ values.',
'Dates must be formatted YYYY-MM-DD. sex must be "M" or "F". nationality: the 3-letter code if known (e.g. LBY), else the printed word.',
'Use null for any field that is truly unreadable. NEVER invent values.',
'Return ONLY this JSON object and nothing else:',
'{"surname":"","given_names":"","nationality":"","passport_number":"","date_of_birth":"","sex":"","date_of_issue":"","date_of_expiry":"","place_of_birth":"","issuing_authority":"","mrz_line1":"","mrz_line2":"","rotation_degrees_needed":0}'
].join('\n');

/* ---------- المفتاح ---------- */
function cleanKey(){var k=document.getElementById('apikey').value||'';return k.replace(/\s+/g,'').replace(/^["']+|["']+$/g,'')}
function saveKey(){localStorage.setItem('gk',cleanKey())}
function getKey(){return (localStorage.getItem('gk')||'').trim()}
document.getElementById('apikey').value=getKey();
function toggleEye(){var i=document.getElementById('apikey');i.type=(i.type==='password')?'text':'password'}

/* ---------- أدوات ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showErr(m){errbox.hidden=false;errbox.innerHTML='⚠️ '+esc(m);res.hidden=true;copyBtn.hidden=true}
function gerr(j){return (j&&j.error&&j.error.message)?j.error.message:''}

var origFile=null;
document.getElementById('cam').onchange=function(e){go(e.target.files[0])};
document.getElementById('gal').onchange=function(e){go(e.target.files[0])};
function go(f){
 if(!f)return;
 origFile=f;
 errbox.hidden=true;res.hidden=true;copyBtn.hidden=true;
 pv.onload=run;
 pv.src=URL.createObjectURL(f);
 pv.hidden=false}

function rotC(img,rot){
 var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
 var c=document.createElement('canvas');
 if(rot%180){c.width=h;c.height=w}else{c.width=w;c.height=h}
 var x=c.getContext('2d');
 x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);
 x.drawImage(img,-w/2,-h/2);return c}

function toB64(file){
 return new Promise(function(resolve,reject){
  var fr=new FileReader();
  fr.onload=function(){
   var img=new Image();
   img.onload=function(){
    var mx=1800,sc=Math.min(1,mx/Math.max(img.width,img.height));
    var c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    var x=c.getContext('2d');
    x.imageSmoothingQuality='high';
    x.drawImage(img,0,0,c.width,c.height);
    var durl=c.toDataURL('image/jpeg',0.92);
    resolve({b64:durl.split(',')[1],mime:'image/jpeg'})};
   img.onerror=function(){reject(new Error('تعذر قراءة الصورة'))};
   img.src=fr.result};
  fr.onerror=function(){reject(new Error('تعذر فتح الملف'))};
  fr.readAsDataURL(file)})}

/* ---------- الاتصال عبر مباشر أو وسيط ---------- */
async function callGem(key,model,payload){
 var url=GEM+model+':generateContent?key='+encodeURIComponent(key);
 var last=null;
 for(var p=0;p<PROXIES.length;p++){
  var full=(PROXIES[p]?PROXIES[p]+encodeURIComponent(url):url);
  try{
   var resp=await fetch(full,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   var txt=await resp.text(),j=null;
   try{j=JSON.parse(txt)}catch(e){}
   return{status:resp.status,json:j,txt:txt,via:PROXIES[p]?'وسيط':'مباشر'}}
  catch(e){last=e;continue}}
 throw new Error('تعذر الاتصال بالسيرفر مباشرة وعبر الوسطاء — تحقق من الإنترنت')}

function parseGem(j){
 if(j&&j.candidates&&j.candidates.length){
  var c=j.candidates[0];
  if(c.content&&c.content.parts&&c.content.parts.length){
   var t='';
   for(var i=0;i<c.content.parts.length;i++)t+=(c.content.parts[i].text||'');
   t=t.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
   try{return JSON.parse(t)}catch(e){}
   var a=t.indexOf('{'),b=t.lastIndexOf('}');
   if(a>-1&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e2){}}}}
 return null}

async function testKey(){
 var out=document.getElementById('testout'),key=getKey();
 if(!key){out.innerHTML='<span style="color:#ff9a8a">الصق المفتاح أولاً.</span>';return}
 if(key.indexOf('AIza')!==0){out.innerHTML='<span style="color:#ff9a8a">⚠️ مفاتيح جوجل تبدأ بـ AIza — يبدو أنه لم يُنسخ كاملاً.</span>';return}
 out.innerHTML='<span style="color:#f4a261">⏳ جارٍ اختبار المفتاح...</span>';
 try{
  for(var i=0;i<MODELS.length;i++){
   var r=await callGem(key,MODELS[i],{contents:[{parts:[{text:'Reply with the word OK'}]}],generationConfig:{maxOutputTokens:10}});
   if(r.status===404)continue;
   if(r.status===200){out.innerHTML='<span style="color:#9be3c9">✅ المفتاح يعمل بنجاح!</span> (عبر '+r.via+') — أرسل الآن صورة الجواز 📷';return}
   var m=gerr(r.json);
   if(r.status===400&&/API key not valid/i.test(m)){out.innerHTML='<span style="color:#ff9a8a">❌ المفتاح غير صالح — انسخه من جديد كاملاً من AI Studio.</span>';return}
   out.innerHTML='<span style="color:#ff9a8a">❌ خطأ '+r.status+(m?' — '+esc(m):'')+'</span>';return}
  out.innerHTML='<span style="color:#ff9a8a">❌ كل الموديلات ردت 404 — الخدمة قد تكون محجوبة عند مزوّد الإنترنت. افتح generativelanguage.googleapis.com في المتصفح وأخبرني بما ترى.</span>';
 }catch(e){out.innerHTML='<span style="color:#ff9a8a">❌ '+esc(e.message)+'</span>'}}

/* ---------- التحقق الرياضي من MRZ ---------- */
function cd(s){var w=[7,3,1],t=0,i,c;
 for(i=0;i<s.length;i++){c=s.charAt(i);t+=(c==='<'?0:(c<='9'?+c:c.charCodeAt(0)-55))*w[i%3]}
 return t%10}

function verify(d){
 d.okDoc=d.okDob=d.okExp=null;
 var l1=String(d.mrz_line1||'').toUpperCase().replace(/[^A-Z0-9<]/g,'');
 var l2=String(d.mrz_line2||'').toUpperCase().replace(/[^A-Z0-9<]/g,'');
 d.hasMrz=(l1.charAt(0)==='P'&&l2.length>=28);
 if(!d.hasMrz)return;
 if(/\d/.test(l2.charAt(9)))d.okDoc=cd(l2.slice(0,9))===+l2.charAt(9);
 if(/\d/.test(l2.charAt(19)))d.okDob=cd(l2.slice(13,19))===+l2.charAt(19);
 if(/\d/.test(l2.charAt(27)))d.okExp=cd(l2.slice(21,27))===+l2.charAt(27)}

function crossNotes(d){
 var notes=[],l2=String(d.mrz_line2||'').toUpperCase().replace(/[^A-Z0-9<]/g,'');
 if(l2.length>=28){
  var dob=l2.slice(13,19),exp=l2.slice(21,27);
  function mrzD(s,isExp){
   if(!/^\d{6}$/.test(s))return null;
   var y=+s.slice(0,2),cy=new Date().getFullYear()%100;
   var yr=isExp?2000+y:(y>cy?1900+y:2000+y);
   return yr+'-'+s.slice(2,4)+'-'+s.slice(4)}
  var d1=mrzD(dob),d2=mrzD(exp,true);
  if(d1&&d.date_of_birth&&d1!==d.date_of_birth)notes.push('• تنبيه: الميلاد في MRZ ('+d1+') يختلف عن المقروء ('+d.date_of_birth+')');
  if(d2&&d.date_of_expiry&&d2!==d.date_of_expiry)notes.push('• تنبيه: الانتهاء في MRZ ('+d2+') يختلف عن المقروء ('+d.date_of_expiry+')');
  var docM=l2.slice(0,9).replace(/</g,'');
  if(docM&&d.passport_number&&docM!==String(d.passport_number).toUpperCase())notes.push('• تنبيه: رقم الجواز في MRZ ('+docM+') يختلف عن المقروء ('+d.passport_number+')')}
 return notes}

/* ---------- المعالجة الرئيسية ---------- */
async function run(){
 errbox.hidden=true;res.hidden=true;copyBtn.hidden=true;
 var key=getKey();
 if(!key){showErr('لا يوجد مفتاح. اذهب إلى aistudio.google.com → Get API key → انسخه والصقه أعلاه، ثم أعد اختيار الصورة.');st.textContent='';return}
 try{
  st.textContent='🖼️ جارٍ تجهيز الصورة...';
  var im=await toB64(origFile);
  var payload={contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:im.mime,data:im.b64}}]}],
   generationConfig:{temperature:0,response_mime_type:'application/json'}};
  var last=null,fmtFail=false;
  for(var i=0;i<MODELS.length;i++){
   st.textContent='☁️ جارٍ قراءة الجواز بالمحرك الذكي...';
   var r;
   try{r=await callGem(key,MODELS[i],payload)}
   catch(e){showErr(e.message);st.textContent='';return}
   if(r.status===200){
    var d=parseGem(r.json);
    if(d){st.textContent='✅ تمت القراءة بنجاح';render(d);return}
    fmtFail=true;last=r;continue}
   if(r.status===400){
    var m=gerr(r.json);
    if(/API key not valid/i.test(m)){showErr('المفتاح غير صالح — اضغط «اختبار المفتاح» للتأكد منه.');st.textContent='';return}
    last=r;continue}
   if(r.status===403){showErr('المفتاح مرفوض (403) — '+(gerr(r.json)||'راجع صلاحياته في AI Studio'));st.textContent='';return}
   if(r.status===429){showErr('طلبات كثيرة متقاربة — انتظر نصف دقيقة وأعد المحاولة.');st.textContent='';return}
   last=r;continue}
  if(fmtFail){showErr('وصل رد غير مفهوم من المحرك — أعد المحاولة مرة أخرى.')}
  else{showErr('تعذّرت القراءة [HTTP '+(last?last.status:'?')+']'+(last&&gerr(last.json)?' — '+gerr(last.json):'')+'. أعد المحاولة أو انسخ لي هذه الرسالة.')}
  st.textContent='';
 }catch(e){showErr('خطأ غير متوقع: '+e.message);st.textContent=''}}

/* ---------- العرض ---------- */
function normDate(s){
 if(!s)return null;
 s=String(s).trim();
 var m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
 if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
 var m2=s.match(/^(\d{1,2})[\s.\/-](\d{1,2})[\s.\/-](\d{4})$/);
 if(m2)return m2[3]+'-'+('0'+m2[2]).slice(-2)+'-'+('0'+m2[1]).slice(-2);
 return s}

function render(d){
 verify(d);
 var notes=crossNotes(d);
 var rot=parseInt(d.rotation_degrees_needed,10);
 if(rot===90||rot===180||rot===270){pv.onload=null;pv.src=rotC(pv,rot).toDataURL('image/jpeg',0.92)}
 function natDisp(nat){
  if(!nat)return'';
  var s=String(nat).toUpperCase().trim();
  if(C[s])return C[s]+' ('+s+')';
  if(WORD[s])return (C[WORD[s]]||s)+' ('+WORD[s]+')';
  return String(nat)}
 function mark(v){return v===true?' ✔':v===false?' ⚠️':''}
 var sex=d.sex;
 if(/^(m|male|ذكر)/i.test(String(sex||'')))sex='M';
 else if(/^(f|female|أنثى)/i.test(String(sex||'')))sex='F';
 var dob=normDate(d.date_of_birth),iss=normDate(d.date_of_issue),expd=normDate(d.date_of_expiry);
 var rows=[];
 function add(l,v,mk){if(v!==null&&v!==undefined&&v!=='')rows.push([l,v,mk||''])}
 add('اسم العائلة',d.surname);
 add('الاسم الأول',d.given_names);
 add('الجنسية',natDisp(d.nationality));
 add('رقم الجواز',d.passport_number,mark(d.okDoc));
 add('تاريخ الميلاد',dob,mark(d.okDob));
 add('الجنس',sex==='M'?'ذكر M':sex==='F'?'أنثى F':sex);
 add('تاريخ الإصدار',iss);
 add('تاريخ الانتهاء',expd,mark(d.okExp));
 add('مكان الميلاد',d.place_of_birth);
 add('جهة الإصدار',d.issuing_authority);
 var h='';
 if(!rows.length){showErr('لم تُستخرج بيانات — جرّب صورة أوضح.');return}
 rows.forEach(function(rw){h+='<div class="row"><b>'+rw[0]+'</b><span class="val">'+esc(rw[1])+rw[2]+'</span></div>'});
 if(notes.length)h+='<div class="notes">'+notes.map(esc).join('<br>')+'</div>';
 h+='<div class="src">'+(d.hasMrz?'المصدر: Gemini + تحقق رياضي من سطور MRZ ✔':'المصدر: Gemini (قراءة الصفحة المطبوعة)')+'</div>';
 h+='<div class="warn">✔ = مؤكد بأرقام التحقق، ⚠️ = راجعه مع الصورة. تحقق دائماً قبل إصدار التذكرة.</div>';
 res.innerHTML=h;res.hidden=false;
 var out=[];
 if(d.surname)out.push('SURNAME: '+d.surname);
 if(d.given_names)out.push('GIVEN NAMES: '+d.given_names);
 if(d.nationality)out.push('NATIONALITY: '+natDisp(d.nationality));
 if(d.passport_number)out.push('PASSPORT NO: '+d.passport_number);
 if(dob)out.push('DATE OF BIRTH: '+dob);
 if(sex)out.push('SEX: '+sex);
 if(iss)out.push('ISSUE DATE: '+iss);
 if(expd)out.push('EXPIRY: '+expd);
 if(d.place_of_birth)out.push('PLACE OF BIRTH: '+d.place_of_birth);
 if(d.issuing_authority)out.push('AUTHORITY: '+d.issuing_authority);
 raw.value=out.join('\n');
 copyBtn.hidden=false}

function copyAll(){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(raw.value).then(function(){alert('تم النسخ ✅')})}
 else{raw.hidden=false;raw.select();document.execCommand('copy');raw.hidden=true;alert('تم النسخ ✅')}}
</script>
</body>
</html>
