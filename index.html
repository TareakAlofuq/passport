<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قارئ الجواز - ليبيا</title>
<style>
body{font-family:sans-serif;background:#14141f;color:#eee;max-width:640px;margin:0 auto;padding:18px;text-align:center}
button{background:#2a9d8f;color:#fff;border:0;padding:14px 18px;border-radius:12px;font-size:16px;margin:5px}
button.gray{background:#4a4a5a}
img#preview{max-width:100%;border-radius:12px;margin-top:12px}
#st{color:#f4a261;margin:14px;font-size:15px;min-height:20px}
#result{background:#20202c;border-radius:14px;padding:12px;text-align:right}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #3a3a4a;padding:9px 4px}
.row b{color:#8ecae6;white-space:nowrap}
.val{word-break:break-all;direction:ltr;text-align:right}
.warn{color:#e76f51;font-size:13px;margin-top:8px}
.notes{color:#f4a261;font-size:13px;margin-top:8px;text-align:right}
.tag{display:inline-block;background:#3a3a4a;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px;direction:ltr}
h3{margin:14px 0 4px;color:#8ecae6;font-size:15px}
#rawtext{background:#101018;color:#9be3c9;border-radius:10px;padding:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;text-align:left;direction:ltr;max-height:240px;overflow:auto;margin-top:6px}
.src{font-size:11px;color:#6a6a7a;margin-top:6px}
</style>
</head>
<body>
<h2>🛂 قارئ بيانات الجواز</h2>
<div>
<button onclick="cam.click()">📷 التقاط بالكاميرا</button>
<button onclick="gal.click()">🖼️ اختيار من المعرض</button>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="gal" type="file" accept="image/*" hidden>
<img id="preview" hidden>
<div id="st"></div>
<div id="result" hidden></div>
<button id="rotBtn" class="gray" hidden onclick="rot90()">🔄 تدوير وإعادة المحاولة</button>
<button id="copyBtn" class="gray" hidden onclick="copyAll()">📋 نسخ البيانات كنص</button>
<textarea id="raw" hidden></textarea>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
var st=document.getElementById('st'),res=document.getElementById('result'),pv=document.getElementById('preview'),
    copyBtn=document.getElementById('copyBtn'),raw=document.getElementById('raw'),rotBtn=document.getElementById('rotBtn');
var C={LBY:'ليبيا 🇱🇾',EGY:'مصر',TUN:'تونس',DZA:'الجزائر',MAR:'المغرب',SDN:'السودan'.replace('السودan','السودان'),YEM:'اليمن',SYR:'سوريا',JOR:'الأردن',LBN:'لبنان',PSE:'فلسطين',IRQ:'العراق',KWT:'الكويت',QAT:'قطر',ARE:'الإمارات',OMN:'عُمان',BHR:'البحرين',SAU:'السعودية',TUR:'تركيا',USA:'أمريكا',GBR:'بريطانيا',FRA:'فرنسا',ITA:'إيطاليا',DEU:'ألمانيا',MLI:'مالي',NER:'النيجر',TCD:'تشاد',CIV:'ساحل العاج',SEN:'السنغال',GHA:'غانا',NGA:'نيجيريا'};

document.getElementById('cam').onchange=function(e){go(e.target.files[0])};
document.getElementById('gal').onchange=function(e){go(e.target.files[0])};
function go(f){if(!f)return;rotBtn.hidden=false;pv.onload=run;pv.src=URL.createObjectURL(f);pv.hidden=false}
function rot90(){pv.onload=run;pv.src=rotC(pv,90).toDataURL('image/jpeg',0.92)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var ph='';
function log(m){if(m.status==='recognizing text')st.textContent=ph+' %'+Math.round(m.progress*100)}

function rotC(img,rot){
 if(!rot)return img;
 var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
 var c=document.createElement('canvas');
 if(rot%180){c.width=h;c.height=w}else{c.width=w;c.height=h}
 var x=c.getContext('2d');
 x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);
 x.drawImage(img,-w/2,-h/2);return c}

function unsh(g,w,h,a){
 var o=new Uint8ClampedArray(g.length);
 for(var y=0;y<h;y++)for(var x=0;x<w;x++){
  var i=y*w+x;
  if(!y||!x||y===h-1||x===w-1){o[i]=g[i];continue}
  var b=(g[i-1]+g[i+1]+g[i-w]+g[i+w])*.25;
  o[i]=g[i]+a*(g[i]-b)}
 return o}

function norm(g){
 var mn=255,mx=0,i;
 for(i=0;i<g.length;i++){if(g[i]<mn)mn=g[i];if(g[i]>mx)mx=g[i]}
 var r=Math.max(1,mx-mn);
 for(i=0;i<g.length;i++)g[i]=Math.round((g[i]-mn)*255/r)}

function otsu(g){
 var h=new Array(256).fill(0),i;
 for(i=0;i<g.length;i++)h[g[i]]++;
 var tot=g.length,sum=0;
 for(i=0;i<256;i++)sum+=i*h[i];
 var sB=0,wB=0,mv=0,th=127;
 for(i=0;i<256;i++){
  wB+=h[i];if(!wB)continue;
  var wF=tot-wB;if(!wF)break;
  sB+=i*h[i];
  var mB=sB/wB,mF=(sum-sB)/wF;
  var v=wB*wF*(mB-mF)*(mB-mF);
  if(v>mv){mv=v;th=i}}
 return th}

function prep(src,sc,cf,pr){
 var w=src.naturalWidth||src.width,h=src.naturalHeight||src.height,sy=0,sh=h;
 if(cf){sh=Math.round(h*cf);sy=h-sh}
 var nw=Math.round(w*sc),nh=Math.round(sh*sc);
 var c=document.createElement('canvas');c.width=nw;c.height=nh;
 var x=c.getContext('2d');
 x.imageSmoothingQuality='high';
 x.drawImage(src,0,sy,w,sh,0,0,nw,nh);
 var d=x.getImageData(0,0,nw,nh),p=d.data,n=nw*nh,i,g=new Uint8ClampedArray(n);
 for(i=0;i<n;i++){var j=i*4;g[i]=(p[j]*.3+p[j+1]*.59+p[j+2]*.11)|0}
 if(pr==='sh'){g=unsh(g,nw,nh,1.8);norm(g)}
 else if(pr==='ot'){g=unsh(g,nw,nh,.8);var t=otsu(g);for(i=0;i<n;i++)g[i]=g[i]<=t?0:255}
 else{norm(g)}
 for(i=0;i<n;i++){var j2=i*4;p[j2]=p[j2+1]=p[j2+2]=g[i];p[j2+3]=255}
 x.putImageData(d,0,0);return c}

/* ---- MRZ ---- */
function cd(s){var w=[7,3,1],t=0,i,c;
 for(i=0;i<s.length;i++){c=s.charAt(i);
  t+=(c==='<'?0:(c<='9'?+c:c.charCodeAt(0)-55))*w[i%3]}
 return t%10}

function dtF(s,ie){
 if(!/^\d{6}$/.test(s))return s;
 var y=+s.slice(0,2),cy=new Date().getFullYear()%100;
 var yr=ie?2000+y:(y>cy?1900+y:2000+y);
 return yr+'-'+s.slice(2,4)+'-'+s.slice(4)}

function fixCk(d){
 var nt=[],AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<';
 if(!d.okDoc&&/^\d$/.test(d.ckDoc)){
  L1:for(var i=0;i<9;i++)for(var a=0;a<37;a++){
   var ch=AL[a];
   if(ch===d.dr.charAt(i))continue;
   var t=d.dr.slice(0,i)+ch+d.dr.slice(i+1);
   if(cd(t)===+d.ckDoc){d.dr=t;d.doc=t.replace(/</g,'');d.okDoc=true;
    nt.push('• رقم الجواز: صُحّح محرف تلقائياً');break L1}}}
 [['dob','Dob','الميلاد'],['exp','Exp','الانتهاء']].forEach(function(q){
  var k=q[0],K=q[1],lb=q[2],ok='ok'+K,ck='chk'+K;
  if(d[ok])return;
  var s=d[k],c=d[ck];
  if(/^\d$/.test(c)){
   L2:for(var i2=0;i2<6;i2++)for(var dg=0;dg<10;dg++){
    var t2=s.slice(0,i2)+(''+dg)+s.slice(i2+1);
    if(t2===s)continue;
    if(cd(t2)===+c&&plaus(t2)){d[k]=t2;d[ok]=true;
     nt.push('• '+lb+': صُحّح رقم تلقائياً');break L2}}}})}
 return nt}

function plaus(s){
 if(!/^\d{6}$/.test(s))return false;
 var m=+s.slice(2,4),dd=+s.slice(4);
 return m>=1&&m<=12&&dd>=1&&dd<=31}

function parseMRZ(l1,l2){
 var nm=l1.slice(5).split('<<');
 var d={iss:l1.slice(2,5).replace(/</g,''),
  sn:(nm[0]||'').replace(/</g,' ').trim(),
  gv:(nm[1]||'').replace(/</g,' ').trim(),
  dr:l2.slice(0,9),doc:l2.slice(0,9).replace(/</g,''),
  ctry:l2.slice(10,13).replace(/</g,''),
  dob:l2.slice(13,19),sex:l2.charAt(20),exp:l2.slice(21,27),
  chkDoc:l2.charAt(9),chkDob:l2.charAt(19),chkExp:l2.charAt(27)};
 d.okDoc=cd(d.dr)===+d.chkDoc;
 d.okDob=cd(d.dob)===+d.chkDob;
 d.okExp=cd(d.exp)===+d.chkExp;
 return d}

function tryMRZ(text){
 var ls=text.toUpperCase().split(/\n/).map(function(l){return l.replace(/[^A-Z0-9<]/g,'')})
  .filter(function(l){return l.length>=36&&l.length<=50&&l.indexOf('<')>-1});
 if(!ls.length)return null;
 var cand=[];
 if(ls.length===1){if(ls[0].length>=84)cand.push([ls[0].slice(0,44),ls[0].slice(44,88)])}
 else{for(var i=0;i<ls.length-1;i++){if(ls[i][0]==='P')cand.push([ls[i],ls[i+1]])}
  if(!cand.length)cand.push([ls[ls.length-2],ls[ls.length-1]])}
 var full=null,best=null,bC=-1;
 for(var k=0;k<cand.length;k++){
  var a=(cand[k][0]+Array(45).join('<')).slice(0,44);
  var b=(cand[k][1]+Array(45).join('<')).slice(0,44);
  if(a[0]!=='P')continue;
  var d=parseMRZ(a,b);
  var c=(d.okDoc?1:0)+(d.okDob?1:0)+(d.okExp?1:0);
  if(c===3){full=d;break}
  if(c>bC){bC=c;best=d}}
 return {full:full,part:best,pc:bC}}

function mrzSc(t){
 var b=0;
 t.toUpperCase().split(/\n/).forEach(function(l){
  var c=l.replace(/[^A-Z0-9<]/g,'');
  if(c.length>=36){var s=c.length+(c.indexOf('<<')>-1?20:0)+(c[0]==='P'?10:0);
   if(s>b)b=s}});
 return b}

/* ---- الصفحة المطبوعة (مخصص لليبيا) ---- */
function parsePrinted(text){
 var t=text.toUpperCase().replace(/[^\x00-\x7F\n]/g,' ');
 var cl=t.replace(/\s+/g,' ').trim();
 var r={},cf={}; // cf = confidence flags

 /* 1) استخراج كل التواريخ */
 var dp=/\b(\d{1,2})[\s.\/\-](\d{1,2})[\s.\/\-](\d{4})\b/g;
 var dates=[],m;
 while((m=dp.exec(cl))!==null){
  var dd=+m[1],mm=+m[2],yy=+m[3];
  if(mm>=1&&mm<=12&&dd>=1&&dd<=31&&yy>=1920&&yy<=2100){
   dates.push({o:m[0],d:dd,mth:mm,y:yy,ts:new Date(yy,mm-1,dd).getTime()})}}
 dates.sort(function(a,b){return a.ts-b.ts});

 /* 2) تعيين التواريخ بالعناوين */
 function near(label,date){
  var li=cl.indexOf(label);
  if(li<0)return false;
  var di=cl.indexOf(date.o);
  if(di<0)return false;
  return Math.abs(li-di)<80}

 if(dates.length>=3){
  r.dob=dates[0].o;cf.dob='auto';
  var rest=dates.slice(1);
  r.issue=rest[0].o;cf.issue='auto';
  r.exp=rest[rest.length-1].o;cf.exp='auto';
  /* التحقق بالعناوين إذا وجدت */
  dates.forEach(function(dt){
   if(near('DATE OF BIRTH',dt)||near('BIRTH DATE',dt)){r.dob=dt.o;cf.dob='label'}
   if(near('DATE OF ISSUE',dt)||near('ISSUE DATE',dt)){r.issue=dt.o;cf.issue='label'}
   if(near('DATE OF EXPIRY',dt)||near('EXPIRY',dt)){r.exp=dt.o;cf.exp='label'}});
 }else if(dates.length===2){
  r.dob=dates[0].o;cf.dob='auto';
  var d2=dates[1];
  if(d2.ts>Date.now()){r.exp=d2.o;cf.exp='auto'}
  else{r.issue=d2.o;cf.issue='auto'}
  dates.forEach(function(dt){
   if(near('DATE OF BIRTH',dt)){r.dob=dt.o;cf.dob='label'}
   if(near('DATE OF EXPIRY',dt)||near('EXPIRY',dt)){r.exp=dt.o;cf.exp='label'}});
 }else if(dates.length===1){
  var d1=dates[0];
  if(d1.y<2010){r.dob=d1.o;cf.dob='auto'}
  else if(d1.ts>Date.now()){r.exp=d1.o;cf.exp='auto'}
  else{r.issue=d1.o;cf.issue='auto'}
  if(near('DATE OF BIRTH',d1)){r.dob=d1.o;cf.dob='label'}
  if(near('DATE OF EXPIRY',d1)){r.exp=d1.o;cf.exp='label'}}

 /* 3) رقم الجواز */
 var pm=cl.match(/\b([A-Z]{1,3}\d{6,9})\b/);
 if(pm){r.doc=pm[1];cf.doc='pattern'}
 var plm=cl.match(/PASSPORT\s*(?:NO\.?|NUMBER)?\s*[:\-\/]?\s*([A-Z]{1,3}\d{6,9})/);
 if(plm){r.doc=plm[1];cf.doc='label'}

 /* 4) الجنسية */
 if(cl.indexOf('LIBYAN')>-1){r.nat='LIBYAN';cf.nat='label'}
 else if(cl.indexOf('LBY')>-1){r.nat='LBY';cf.nat='auto'}
 else{
  var nm2=cl.match(/NATIONALITY[\s:\/\-]*(LIBYAN|LBY|EGYPTIAN|EGY|TUNISIAN|TUN|SUDANESE|SDN|ALGERIAN|DZA|MOROCCAN|MAR|YEMENI|YEM|SYRIAN|SYR|CHADIAN|TCD|MALIAN|MLI|NIGERIEN|NER)/);
  if(nm2){r.nat=nm2[1];cf.nat='label'}}

 /* 5) الجنس */
 var sm=cl.match(/\bSEX\s*[:\-\/]?\s*(M|F)\b/);
 if(sm)r.sex=sm[1];

 /* 6) الاسم */
 var snm=cl.match(/(?:SURNAME|FAMILY NAME|LAST NAME)[\s:\/\-]*([A-Z][A-Z'\s\-]{1,35}?)(?=\s*(?:GIVEN|NATIONALITY|DATE|SEX|PLACE|TYPE|COUNTRY|PASSPORT|NO\.|NUMBER|ISSUE|EXPIR))/);
 if(snm){r.sn=snm[1].trim();cf.sn='label'}
 var gnm=cl.match(/(?:GIVEN NAMES?|GIVEN NAME|FIRST NAME|FORENAMES)[\s:\/\-]*([A-Z][A-Z'\s\-]{1,35}?)(?=\s*(?:NATIONALITY|DATE|SEX|PLACE|TYPE|COUNTRY|PASSPORT|NO\.|NUMBER|ISSUE|EXPIR))/);
 if(gnm){r.gv=gnm[1].trim();cf.gv='label'}

 /* 7) لو لم نجد الاسم بالعناوين — استخراج ذكي */
 if(!r.sn&&!r.gv){
  var skip=['STATE','OF','LIBYA','PASSPORT','TYPE','COUNTRY','SURNAME','GIVEN','NAMES','NAME',
   'NATIONALITY','DATE','BIRTH','PLACE','ISSUE','EXPIRY','EXPIRATION','SEX','MALE','FEMALE',
   'CODE','AUTHORITY','SIGNATURE','HOLDER','REPUBLIC','JAMAHIRIYA','ARAB','PEOPLES',
   'SOCIALIST','PEOPLE','THE','TRIPOLI','BENGHAZI','MISURATA','SABHA','TOBRUK','SIRTE','AL'];
  var words=cl.split(/\s+/);
  var cur=[],best=[];
  for(var i=0;i<words.length;i++){
   var wd=words[i].replace(/[^A-Z'\-]/g,'');
   if(wd.length>=2&&skip.indexOf(wd)===-1&&!/^\d/.test(wd)){
    cur.push(wd);
    if(cur.length>best.length)best=cur.slice()}
   else cur=[]}
  if(best.length>=2){
   r.sn=best[best.length-1];
   r.gv=best.slice(0,-1).join(' ');
   cf.sn='guess';cf.gv='guess'}
  else if(best.length===1){
   r.sn=best[0];cf.sn='guess'}}

 /* 8) مكان الإصدار/الميلاد */
 var cities=['TRIPOLI','BENGHAZI','MISURATA','SABHA','TOBRUK','SIRTE','ALKHUMS','ZAWIYA','DARNA'];
 for(var ci=0;ci<cities.length;ci++){
  if(cl.indexOf(cities[ci])>-1){
   if(!r.pob)r.pob=cities[ci];
   if(!r.poi)r.poi=cities[ci];break}}

 return {r:r,cf:cf,dates:dates.map(function(d){return d.o}),allText:text.trim()}}

/* ---- المعالجة الرئيسية ---- */
async function run(){
 try{
  res.hidden=true;copyBtn.hidden=true;
  ph='جارٍ تحميل محرك القراءة (أول مرة فقط يأخذ وقتاً أطول)';
  st.textContent=ph;
  var w0=pv.naturalWidth||pv.width;
  var sc=w0<600?3.5:w0<900?3:w0<1300?2.2:w0<1800?1.6:1.2;
  if(sc<1)sc=1;
  if(w0*sc>2400)sc=2400/w0;
  var wk=await Tesseract.createWorker('eng',1,{logger:log});
  var d=null,rot=0,bRot=0,bSc=0,gp=null,gC=-1,gR=0,i,j,r2;

  function take(txt,rt){
   var e=tryMRZ(txt);
   if(!e)return false;
   if(e.part&&e.pc>gC){gp=e.part;gC=e.pc;gR=rt}
   if(e.full){d=e.full;return true}
   return false}

  /* مرحلة 1: الاتجاهات الأربعة + MRZ */
  var rots=[0,180,90,270];
  for(i=0;i<rots.length;i++){
   ph=rots[i]?'🔄 فحص الاتجاه ('+rots[i]+'°)...':'جارٍ قراءة سطور MRZ...';
   await wk.setParameters({tessedit_pageseg_mode:'6'});
   r2=await wk.recognize(prep(rotC(pv,rots[i]),sc,0.42,'sh'));
   var s2=mrzSc(r2.data.text);
   if(s2>bSc){bSc=s2;bRot=rots[i]}
   if(take(r2.data.text,rots[i])){rot=rots[i];break}}

  /* مرحلة 2: تحسينات إضافية */
  if(!d&&bSc>0){
   var src2=rotC(pv,bRot);
   var vars=[{cf:.42,pr:'ot'},{cf:.30,pr:'ot'},{cf:.42,pr:'sh'},{cf:.50,pr:'sh'}];
   for(j=0;j<vars.length;j++){
    ph='🔬 محاولة تحسين ('+(j+1)+'/'+vars.length+')...';
    await wk.setParameters({tessedit_pageseg_mode:'6'});
    r2=await wk.recognize(prep(src2,sc,vars[j].cf,vars[j].pr));
    if(take(r2.data.text,bRot)){rot=bRot;break}}}

  /* مرحلة 3: تصحيح + عرض MRZ */
  var notes=[];
  if(d){notes=fixCk(d);await wk.terminate();
   if(rot){pv.onload=null;pv.src=rotC(pv,rot).toDataURL('image/jpeg',0.92)}
   st.textContent='✅ تمت القراءة من سطور MRZ'+(rot?' (صُحّح الاتجاه)':'');
   renderMRZ(d,notes);return}

  if(gp){notes=fixCk(gp);
   if(gp.okDoc&&gp.okDob&&gp.okExp){d=gp;await wk.terminate();
    if(gR){pv.onload=null;pv.src=rotC(pv,gR).toDataURL('image/jpeg',0.92)}
    st.textContent='✅ تمت القراءة (بعد التصحيح التلقائي)';
    renderMRZ(d,notes);return}}

  /* مرحلة 4: الصفحة المطبوعة (الليبية) */
  ph='جارٍ قراءة الصفحة المطبوعة كاملة...';
  st.textContent=ph;
  await wk.setParameters({tessedit_pageseg_mode:'3'});
  var best=null;
  var ors=[bRot||0,(bRot||0)+180];
  for(i=0;i<2;i++){
   r2=await wk.recognize(prep(rotC(pv,ors[i]%360),sc,null,i?'ot':'sh'));
   var sc2=(r2.data.text.match(/[A-Z]{2,}/g)||[]).length;
   if(!best||sc2>best.sc)best={tx:r2.data.text,sc:sc2,rot:ors[i]%360}}
  await wk.terminate();
  if(best.rot){pv.onload=null;pv.src=rotC(pv,best.rot).toDataURL('image/jpeg',0.92)}
  var pr=parsePrinted(best.tx);
  renderPrinted(pr);
 }catch(err){st.textContent='⚠️ خطأ: '+err.message}}

/* ---- العرض ---- */
function mk(b,re){return re?' ⚠️':(b?' ✔':' ⚠️')}

function renderMRZ(d,nt){
 var cc=C[d.ctry]||C[d.iss]||d.ctry||d.iss;
 var rows=[['اسم العائلة',d.sn],['الاسم الأول',d.gv],['الجنسية',cc],
  ['رقم الجواز',d.doc+mk(d.okDoc)],['تاريخ الميلاد',dtF(d.dob)+mk(d.okDob)],
  ['الجنس',d.sex==='M'?'ذكر M':d.sex==='F'?'أنثى F':d.sex],
  ['تاريخ الانتهاء',dtF(d.exp,true)+mk(d.okExp)]];
 var h='';
 rows.forEach(function(rw){h+='<div class="row"><b>'+rw[0]+'</b><span class="val">'+esc(rw[1])+'</span></div>'});
 if(nt&&nt.length)h+='<div class="notes">'+nt.join('<br>')+'</div>';
 h+='<div class="src">المصدر: سطور MRZ ✔ (موثوق)</div>';
 res.innerHTML=h;res.hidden=false;
 raw.value='SURNAME: '+d.sn+'\nGIVEN NAMES: '+d.gv+'\nNATIONALITY: '+(d.ctry||d.iss)
  +'\nPASSPORT NO: '+d.doc+'\nDATE OF BIRTH: '+dtF(d.dob)+'\nSEX: '+d.sex+'\nEXPIRY: '+dtF(d.exp,true);
 copyBtn.hidden=false}

function renderPrinted(pr){
 var r=pr.r,cf=pr.cf;
 var h='';
 function add(label,val,conf){
  if(!val)return;
  var mark=conf==='label'?' ✔':conf==='auto'?' ✔?':' ⚠️?';
  h+='<div class="row"><b>'+label+'</b><span class="val">'+esc(val)+mark+'</span></div>'}
 add('الاسم الكامل',(r.gv?r.gv+' ':'')+(r.sn||''),cf.sn==='label'?'label':cf.sn);
 add('اسم العائلة',r.sn,cf.sn);
 add('الاسم الأول',r.gv,cf.gv);
 add('الجنسية',C[r.nat]?C[r.nat]+' ('+r.nat+')':r.nat,cf.nat);
 add('رقم الجواز',r.doc,cf.doc);
 add('تاريخ الميلاد',r.dob,cf.dob);
 add('الجنس',r.sex==='M'?'ذكر M':r.sex==='F'?'أنثى F':r.sex,r.sex?'label':'');
 add('تاريخ الإصدار',r.issue,cf.issue);
 add('تاريخ الانتهاء',r.exp,cf.exp);
 add('مكان الإصدار',r.poi,r.poi?'auto':'');
 if(!r.sn&&!r.gv&&!r.doc&&!r.dob&&!r.exp){
  h+='<div class="warn">لم أستطع استخراج بيانات واضحة. جرّب صورة أوضح أو استخدم النص الكامل بالأسفل.</div>'}
 if(pr.dates.length){
  h+='<h3>كل التواريخ المكتشفة</h3>';
  h+=pr.dates.map(function(x){return '<span class="tag">'+x+'</span>'}).join(' ')}
 h+='<h3>النص الكامل المقروء</h3><div id="rawtext">'+esc(pr.allText)+'</div>';
 h+='<div class="warn">⚠️ هذه قراءة تقريبية من الصفحة المطبوعة (بدون MRZ). قارن دائماً بالصورة قبل إصدار التذكرة.</div>';
 h+='<div class="src">المصدر: الصفحة المطبوعة (تقريبي)</div>';
 res.innerHTML=h;res.hidden=false;
 var parts=[];
 if(r.gv||r.sn)parts.push('NAME: '+(r.gv||'')+' '+(r.sn||''));
 if(r.nat)parts.push('NATIONALITY: '+r.nat);
 if(r.doc)parts.push('PASSPORT NO: '+r.doc);
 if(r.dob)parts.push('DATE OF BIRTH: '+r.dob);
 if(r.sex)parts.push('SEX: '+r.sex);
 if(r.issue)parts.push('ISSUE: '+r.issue);
 if(r.exp)parts.push('EXPIRY: '+r.exp);
 raw.value=parts.join('\n')+'\n--- النص الكامل ---\n'+pr.allText;
 copyBtn.hidden=false;
 st.textContent='📄 تمت قراءة الصفحة المطبوعة — تحقق من البيانات'}

function copyAll(){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(raw.value).then(function(){alert('تم النسخ ✅')})}
 else{raw.hidden=false;raw.select();document.execCommand('copy');raw.hidden=true;alert('تم النسخ ✅')}}
</script>
</body>
</html>
